# ==========================================
# SPRING PROFILES & APP CONFIG
# ==========================================
spring.profiles.active=dev
spring.application.name=app_plastinnova_backend
server.port=8080

# Variables locales (credenciales). El archivo .env no se versiona; ver .env.example
spring.config.import=optional:file:.env[.properties]

# ==========================================
# DATASOURCE CONFIGURATION (SQL SERVER)
# ==========================================
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool (Optimización para concurrencia)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA & HIBERNATE
# ==========================================
# El esquema lo administra Flyway; Hibernate solo valida que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
# Usar los nombres exactos de @Table/@Column (ej: "Estado_Pedido"), sin pasarlos a minúsculas
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las columnas de texto son NVARCHAR (Unicode: tildes, ñ)
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.open-in-view=false
# Las relaciones LAZY (producto y estado de cada línea, etc.) se cargan en lotes con IN (...) en vez de una consulta por fila
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Paginación: evita que un cliente pida páginas enormes
spring.data.web.pageable.max-page-size=100

# ==========================================
# FLYWAY (migraciones de base de datos)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Nunca borrar la base desde Flyway
spring.flyway.clean-disabled=true

# ==========================================
# CUSTOM PROPERTIES: SECURITY & FILEMAKER
# ==========================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=86400000

# Orígenes del frontend Angular autorizados (separados por coma)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.filemaker.api.base-url=${FM_URL}
app.filemaker.api.username=${FM_USER}
app.filemaker.api.password=${FM_PASSWORD}
app.filemaker.api.database=${FM_DATABASE:PlastInnova_Info}
# false = acepta cualquier certificado del servidor FileMaker (hoy usa el autofirmado de Claris, vencido).
# Solo para la red interna mientras se instala un certificado válido.
app.filemaker.api.verificar-tls=${FM_VERIFICAR_TLS:true}

# Sincronización del layout PedidosLineas-Api (una fila por línea de pedido)
# Desactivada por defecto: activar con FM_SYNC_ENABLED=true cuando FM_URL apunte al servidor real
app.filemaker.sync.enabled=${FM_SYNC_ENABLED:false}
# Incremental: solo lo modificado en FileMaker desde la ejecución anterior
app.filemaker.sync.cron=${FM_SYNC_CRON:0 */15 * * * *}
# Reconciliación de los pedidos abiertos (detecta líneas borradas en FileMaker), de madrugada
app.filemaker.sync.cron-reconciliacion=${FM_SYNC_CRON_RECONCILIACION:0 0 2 * * *}
# La búsqueda incremental empieza estos minutos antes de la última marca leída (relojes desfasados, guardados lentos)
app.filemaker.sync.margen-incremental-minutos=${FM_SYNC_MARGEN_MINUTOS:60}
app.filemaker.sync.layout=PedidosLineas-Api
app.filemaker.sync.tamano-pagina=500
# Solo se sincronizan las líneas creadas desde esta fecha (hora Colombia). La lectura COMPLETA (primera carga)
# lee todo desde aquí; las siguientes son incrementales
app.filemaker.sync.fecha-desde=${FM_SYNC_FECHA_DESDE:2026-07-01T00:00:00}
# Los pedidos nuevos con estos estados de FileMaker (Ped_Estado) no se importan; separados por coma
app.filemaker.sync.estados-pedido-omitidos=${FM_SYNC_ESTADOS_OMITIDOS:Despachado,Entregado,Anulado}
# Estados de FileMaker que equivalen a un estado local (ValorFileMaker:CODIGO_LOCAL, separados por coma).
# Se aplican solo al importar; los que no coinciden ni tienen equivalencia toman el estado inicial con un aviso.
app.filemaker.sync.equivalencias-estado-pedido=${FM_SYNC_EQUIVALENCIAS_PEDIDO:ParaAlistar:CREADO,EnAlistamiento:CREADO}
app.filemaker.sync.equivalencias-estado-detalle=${FM_SYNC_EQUIVALENCIAS_DETALLE:EnAlistamiento:CREADO}

# ==========================================
# OPENAPI (contrato del cliente generado en app_plastinnova_frontend)
# ==========================================
# Sin esto las respuestas se documentan como */* y el cliente generado las pide como binario (blob)
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
